<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Navy blue background -->
  <rect width="128" height="128" fill="#1B3878"/>

  <!-- Gold ">" chevron (two thick rounded strokes, point facing right) -->
  <path d="M18,24 L60,62 L18,100"
    stroke="#C9A030" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- White "W" shape (stylized, right portion) -->
  <!-- Left valley arm, middle peak, right valley, right bracket -->
  <path d="M56,24 L68,84 L81,50 L96,84 L110,46 L110,26"
    stroke="white" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
