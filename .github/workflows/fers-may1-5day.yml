name: FERS May 1 — 5-day email

# Sends the 5-day pre-webinar email to all Zoom-registered attendees for the
# May 1, 2026 FERS Workshop. Idempotent via Mailchimp sent-tag check.
#
# Schedule:  Apr 27, 2026 at 10:03 AM ET (14:03 UTC).
# Manual:    Use "Run workflow" with optional test_email to send only to one inbox.

on:
  schedule:
    - cron: '3 14 27 4 *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Optional: send only to this email (test mode). Leave blank for real broadcast.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnostic (env var shape, no secret leak)
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          ZOOM_ACCOUNT_ID:   ${{ secrets.ZOOM_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, hashlib
          for k in ('MAILCHIMP_API_KEY', 'MAILCHIMP_LIST_ID', 'ZOOM_ACCOUNT_ID'):
              v = os.environ.get(k, '')
              clean = v.strip()
              h = hashlib.sha256(v.encode()).hexdigest()[:8]
              clean_h = hashlib.sha256(clean.encode()).hexdigest()[:8]
              # Detect non-printable chars
              non_print = sum(1 for c in v if not c.isprintable())
              has_lf = '\n' in v
              has_cr = '\r' in v
              has_space = ' ' in v
              print(f'{k}: len={len(v)} stripped_len={len(clean)} same_after_strip={v==clean} non_print={non_print} lf={has_lf} cr={has_cr} space={has_space} hash={h} stripped_hash={clean_h}')
          # And finally, what BASE_URL looks like
          key = os.environ.get('MAILCHIMP_API_KEY', '').strip()
          dc = key.split('-')[-1] if '-' in key else 'NODASH'
          print(f'derived datacenter: {repr(dc)} len={len(dc)} isalnum={dc.isalnum()}')
          PY

      - name: Send 5-day email
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          ZOOM_ACCOUNT_ID:   ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID:    ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        working-directory: execution
        run: |
          if [ -n "${{ github.event.inputs.test_email }}" ]; then
            echo "TEST MODE: sending only to ${{ github.event.inputs.test_email }}"
            python3 send_webinar_email.py --webinar-date 2026-05-01 --stage 5day --test "${{ github.event.inputs.test_email }}"
          else
            echo "PRODUCTION: sending to all Zoom-registered attendees"
            python3 send_webinar_email.py --webinar-date 2026-05-01 --stage 5day
          fi

      - name: Upload send log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sends-5day-${{ github.run_id }}
          path: .tmp/sends_*.json
          if-no-files-found: warn
          retention-days: 90
