name: FERS May 1 — final reminder (10 min before)

# Sends the "starting in a few minutes" reminder to all registered attendees.
# Schedule:  May 1, 2026 at 10:50 AM ET (14:50 UTC).
# This is the highest-CTR window in the entire sequence.

on:
  # NOTE: scheduled cron is intentionally REMOVED. n8n cloud workflow
  # "FERS May 1 — Final reminder trigger (n8n→GHA)" fires at the precise
  # time and calls workflow_dispatch via the GitHub API. Sub-2-min total
  # drift, vs. multi-hour drift on GHA scheduled crons during peak load.
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Optional: send only to this email (test mode). Leave blank for real broadcast.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send final reminder
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          ZOOM_ACCOUNT_ID:   ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID:    ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        working-directory: execution
        run: |
          if [ -n "${{ github.event.inputs.test_email }}" ]; then
            echo "TEST MODE: sending only to ${{ github.event.inputs.test_email }}"
            python3 send_webinar_email.py --webinar-date 2026-05-01 --stage final --test "${{ github.event.inputs.test_email }}"
          else
            echo "PRODUCTION: sending to all Zoom-registered attendees"
            python3 send_webinar_email.py --webinar-date 2026-05-01 --stage final
          fi

      - name: Upload send log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sends-final-${{ github.run_id }}
          path: |
            .tmp/sends_*.json
            **/.tmp/sends_*.json
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
